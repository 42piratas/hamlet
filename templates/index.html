<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hamlet — a chatbot that answers in Shakespeare quotes.">
    <meta name="theme-color" content="#06101A">
    <title>Hamlet | 42labs</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicons/favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='favicons/favicon-192x192.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='favicons/favicon-192x192.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="app-container">
        <div class="chat-container" id="chat-container"></div>
        <div class="input-area">
            <div class="input-row">
                <textarea id="user-input" rows="3" placeholder="Speak, I charge thee…" autocomplete="off"></textarea>
                <button id="send-btn" type="button" aria-label="Send">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 11.5 21 4l-7.5 18-2.5-8.5L3 11.5Z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            function addMessage(sender, message) {
                var messageClass = sender === 'You' ? 'user-message' : 'bot-message';
                var messageHtml = '<div class="message ' + messageClass + '">' + message + '</div>';
                $('#chat-container').append(messageHtml);
                $('#chat-container').scrollTop($('#chat-container')[0].scrollHeight);
            }

            function escapeHtml(s) {
                return $('<div>').text(s).html();
            }

            $('#send-btn').click(function() {
                var userMessage = $('#user-input').val();
                if (userMessage.trim() !== '') {
                    addMessage('You', escapeHtml(userMessage));
                    $.post('/get_response', {message: userMessage}, function(data) {
                        var card = '<div class="bot-card">'
                                 + '<div class="quote">' + escapeHtml(data.quote) + '</div>'
                                 + '<div class="source">— ' + escapeHtml(data.source) + '</div>'
                                 + '</div>';
                        addMessage('HAMLET', card);
                    });
                    $('#user-input').val('');
                }
            });

            $('#user-input').keydown(function(e) {
                if (e.which === 13 && !e.shiftKey) {
                    e.preventDefault();
                    $('#send-btn').click();
                }
            });
        });
    </script>
</body>
</html>
